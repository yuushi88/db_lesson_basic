Q6
peopleテーブルの中からdepartment_idという
カラムの値が１であるすべてのレコードが選ばれる。
その選ばれたレコードの中からname,email,ageの
三つの格納されているデータが取得され、
作成された古い順から表示される

Q7
SELECT
 name 
FROM 
 people 
WHERE (age between 20 AND 29 AND gender = 2) or 
(age between 40 AND 49 AND gender = 1);

Q8
SELECT
 age 
FROM
 people 
WHERE
 department_id = 1 ORDER BY age DESC;

Q9
SELECT
 AVG(age) AS average_age 
FROM
 people 
WHERE
 department_id = 2 AND gender = 2 GROUP BY gender;

Q10
SELECT 
 people.name, departments.name, reports.content
from 
 people inner join departments on people.department_id = departments.department_id 
 inner join reports on people.person_id = reports.person_id;

Q11
SELECT 
 people.name 
FROM 
 people left join reports on people.person_id = reports.person_id
WHERE 
 content IS NULL;
 